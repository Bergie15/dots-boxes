<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2d42">
<title>Dots &amp; Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece3d0;
    --wood: #e2d5bb;
    --panel: #fffaf0;
    --ink: #2b2d42;
    --muted: #7a7466;
    --dot: #9c968a;
    --dot-ring: #ffffff;
    --line-empty: rgba(43, 45, 66, 0.10);
    --line-hover: rgba(43, 45, 66, 0.35);
    --p1: #d9616c;
    --p2: #5b9bb5;
    --p3: #6db36f;
    --p4: #e0b43c;
    --title: #3d4bd1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1f2b;
      --wood: #2a2d3d;
      --panel: #262938;
      --ink: #eef0f7;
      --muted: #a2a6b8;
      --dot: #8c90a3;
      --dot-ring: #3a3e52;
      --line-empty: rgba(255, 255, 255, 0.08);
      --line-hover: rgba(255, 255, 255, 0.35);
      --title: #8d97ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1f2b; --wood: #2a2d3d; --panel: #262938; --ink: #eef0f7; --muted: #a2a6b8;
    --dot: #8c90a3; --dot-ring: #3a3e52; --line-empty: rgba(255,255,255,0.08);
    --line-hover: rgba(255,255,255,0.35); --title: #8d97ff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fredoka", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1 {
    margin: 4px 0 12px;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 700;
    line-height: 1;
    color: var(--title);
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  h1 span { color: var(--p1); font-size: 0.7em; }

  .scores {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 12px;
  }
  .score {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border-radius: 14px;
    padding: 8px 10px;
    border: 3px solid transparent;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    transition: transform .15s, border-color .15s;
    text-align: center;
  }
  .score.active { border-color: var(--c); transform: translateY(-2px); }
  .score .name {
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score .num { font-size: 26px; font-weight: 700; color: var(--c); line-height: 1.1; }

  .status {
    min-height: 24px;
    font-size: 18px;
    margin-bottom: 10px;
    text-align: center;
  }

  .board-wrap {
    width: 100%;
    max-width: 560px;
    background: var(--wood);
    border-radius: 18px;
    padding: 10px;
    box-shadow: inset 0 0 0 4px rgba(0,0,0,0.04), 0 4px 0 rgba(0,0,0,0.1);
  }
  svg { display: block; width: 100%; height: auto; touch-action: manipulation; }

  .box { opacity: 0; transition: opacity .25s; }
  .box.filled { opacity: 0.85; }
  .line { stroke: var(--line-empty); stroke-linecap: round; transition: stroke .15s; pointer-events: none; }
  .line.taken { stroke: var(--c); }
  .line.last { filter: drop-shadow(0 0 3px var(--c)); }
  .hit { stroke: transparent; stroke-linecap: round; cursor: pointer; }
  @media (hover: hover) {
    .hit:hover + .line:not(.taken) { stroke: var(--line-hover); }
  }
  .dot { fill: var(--dot); stroke: var(--dot-ring); pointer-events: none; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    width: 100%;
    max-width: 560px;
  }
  label { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, button {
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid rgba(0,0,0,0.1);
    border-radius: 10px;
    padding: 8px 12px;
  }
  button {
    background: var(--title);
    color: #fff;
    border: none;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
  }
  .dialog h2 { margin: 0 0 8px; font-size: 30px; }
  .dialog p { margin: 0 0 16px; color: var(--muted); }
</style>
</head>
<body>
  <h1>DOTS <span>&amp;</span> BOXES</h1>

  <div class="scores" id="scores"></div>
  <div class="status" id="status"></div>

  <div class="board-wrap">
    <svg id="board"></svg>
  </div>

  <div class="controls">
    <label>Size
      <select id="size">
        <option value="3">3 × 3</option>
        <option value="5" selected>5 × 5</option>
        <option value="7">7 × 7</option>
        <option value="9">9 × 9</option>
      </select>
    </label>
    <label>Players
      <select id="mode">
        <option value="cpu" selected>1 vs Computer</option>
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
      </select>
    </label>
    <button id="newGame">New Game</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="winTitle"></h2>
      <p id="winText"></p>
      <button id="again">Play Again</button>
    </div>
  </div>

<script>
(() => {
  const COLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
  const SPACING = 60, PAD = 20, DOT_R = 7, LINE_W = 9;
  const NS = "http://www.w3.org/2000/svg";

  const svg = document.getElementById("board");
  const scoresEl = document.getElementById("scores");
  const statusEl = document.getElementById("status");
  const sizeSel = document.getElementById("size");
  const modeSel = document.getElementById("mode");
  const overlay = document.getElementById("overlay");

  let n;            // boxes per side
  let players;      // [{name, cpu}]
  let current, scores, lines, boxes, lineEls, boxEls, lastLineEl, busy;

  // Lines are keyed "h,r,c" (horizontal: row r in 0..n, col c in 0..n-1)
  // or "v,r,c" (vertical: row r in 0..n-1, col c in 0..n).
  const allLines = () => {
    const out = [];
    for (let r = 0; r <= n; r++) for (let c = 0; c < n; c++) out.push(`h,${r},${c}`);
    for (let r = 0; r < n; r++) for (let c = 0; c <= n; c++) out.push(`v,${r},${c}`);
    return out;
  };

  const boxSides = (r, c) => [`h,${r},${c}`, `h,${r + 1},${c}`, `v,${r},${c}`, `v,${r},${c + 1}`];

  const boxesOf = (key) => {
    const [t, rs, cs] = key.split(","); const r = +rs, c = +cs;
    const res = [];
    if (t === "h") { if (r > 0) res.push([r - 1, c]); if (r < n) res.push([r, c]); }
    else { if (c > 0) res.push([r, c - 1]); if (c < n) res.push([r, c]); }
    return res;
  };

  const sideCount = (taken, r, c) => boxSides(r, c).filter(k => taken.has(k)).length;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function newGame() {
    n = +sizeSel.value;
    const mode = modeSel.value;
    if (mode === "cpu") players = [{ name: "You", cpu: false }, { name: "Computer", cpu: true }];
    else players = Array.from({ length: +mode }, (_, i) => ({ name: `Player ${i + 1}`, cpu: false }));

    current = 0;
    scores = players.map(() => 0);
    lines = new Map();   // key -> player index
    boxes = new Map();   // "r,c" -> player index
    lineEls = {}; boxEls = {}; lastLineEl = null; busy = false;
    overlay.classList.remove("show");
    draw();
    render();
  }

  function draw() {
    const size = PAD * 2 + SPACING * n;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.innerHTML = "";
    const P = (i) => PAD + i * SPACING;

    const gBoxes = el("g", {}, svg);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      boxEls[`${r},${c}`] = el("rect", {
        class: "box", x: P(c) + 9, y: P(r) + 9,
        width: SPACING - 18, height: SPACING - 18, rx: 6
      }, gBoxes);
    }

    const gLines = el("g", {}, svg);
    for (const key of allLines()) {
      const [t, rs, cs] = key.split(","); const r = +rs, c = +cs;
      const [x1, y1, x2, y2] = t === "h"
        ? [P(c), P(r), P(c + 1), P(r)]
        : [P(c), P(r), P(c), P(r + 1)];
      const hit = el("line", { class: "hit", x1, y1, x2, y2, "stroke-width": SPACING * 0.5 }, gLines);
      // Shorten the hit target so it doesn't overlap neighbours at the dots.
      const inset = SPACING * 0.2;
      if (t === "h") { hit.setAttribute("x1", x1 + inset); hit.setAttribute("x2", x2 - inset); }
      else { hit.setAttribute("y1", y1 + inset); hit.setAttribute("y2", y2 - inset); }
      lineEls[key] = el("line", { class: "line", x1, y1, x2, y2, "stroke-width": LINE_W }, gLines);
      hit.addEventListener("click", () => {
        if (busy || players[current].cpu) return;
        play(key);
      });
    }

    const gDots = el("g", {}, svg);
    for (let r = 0; r <= n; r++) for (let c = 0; c <= n; c++)
      el("circle", { class: "dot", cx: P(c), cy: P(r), r: DOT_R, "stroke-width": 3 }, gDots);
  }

  function play(key) {
    if (lines.has(key)) return;
    lines.set(key, current);
    const lineEl = lineEls[key];
    lineEl.classList.add("taken");
    lineEl.style.setProperty("--c", COLORS[current]);
    if (lastLineEl) lastLineEl.classList.remove("last");
    lineEl.classList.add("last");
    lastLineEl = lineEl;

    let completed = 0;
    for (const [r, c] of boxesOf(key)) {
      if (sideCount(lines, r, c) === 4) {
        boxes.set(`${r},${c}`, current);
        const b = boxEls[`${r},${c}`];
        b.style.fill = COLORS[current];
        b.classList.add("filled");
        completed++;
      }
    }
    scores[current] += completed;
    if (!completed) current = (current + 1) % players.length;

    render();
    if (lines.size === allLines().length) return finish();
    maybeCpu();
  }

  function render() {
    scoresEl.innerHTML = "";
    players.forEach((p, i) => {
      const d = document.createElement("div");
      d.className = "score" + (i === current ? " active" : "");
      d.style.setProperty("--c", COLORS[i]);
      d.innerHTML = `<div class="name"></div><div class="num">${scores[i]}</div>`;
      d.querySelector(".name").textContent = p.name;
      scoresEl.appendChild(d);
    });
    const p = players[current];
    statusEl.innerHTML = "";
    const s = document.createElement("span");
    s.style.color = COLORS[current];
    s.style.fontWeight = 700;
    s.textContent = p.name === "You" ? "Your" : `${p.name}'s`;
    statusEl.append(s, " turn");
  }

  function finish() {
    const best = Math.max(...scores);
    const winners = players.filter((_, i) => scores[i] === best);
    const title = document.getElementById("winTitle");
    if (winners.length > 1) {
      title.textContent = "It's a tie!";
      title.style.color = "var(--ink)";
    } else {
      const w = players.indexOf(winners[0]);
      title.textContent = winners[0].name === "You" ? "You win!" : `${winners[0].name} wins!`;
      title.style.color = COLORS[w];
    }
    document.getElementById("winText").textContent =
      players.map((p, i) => `${p.name}: ${scores[i]}`).join("  ·  ");
    statusEl.textContent = "Game over";
    setTimeout(() => overlay.classList.add("show"), 500);
  }

  // ---------- Computer player ----------
  function maybeCpu() {
    if (!players[current].cpu) return;
    busy = true;
    setTimeout(() => {
      busy = false;
      if (lines.size < allLines().length) play(cpuMove());
    }, 450);
  }

  // How many boxes the opponent could chain-capture after we play `key`.
  function giveaway(key) {
    const taken = new Set(lines.keys());
    taken.add(key);
    let count = 0, progress = true;
    while (progress) {
      progress = false;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        if (sideCount(taken, r, c) === 3) {
          const missing = boxSides(r, c).find(k => !taken.has(k));
          taken.add(missing);
          count++;
          progress = true;
        }
      }
    }
    return count;
  }

  function cpuMove() {
    const free = allLines().filter(k => !lines.has(k));
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
    shuffle(free);

    // 1. Complete a box if possible.
    const capture = free.find(k => boxesOf(k).some(([r, c]) => sideCount(lines, r, c) === 3));
    if (capture) return capture;

    // 2. Play a line that doesn't create a third side anywhere.
    const safe = free.find(k => boxesOf(k).every(([r, c]) => sideCount(lines, r, c) < 2));
    if (safe) return safe;

    // 3. Forced to give something away: give away as little as possible.
    let best = free[0], bestCost = Infinity;
    for (const k of free) {
      const cost = giveaway(k);
      if (cost < bestCost) { bestCost = cost; best = k; }
    }
    return best;
  }

  document.getElementById("newGame").addEventListener("click", newGame);
  document.getElementById("again").addEventListener("click", newGame);
  sizeSel.addEventListener("change", newGame);
  modeSel.addEventListener("change", newGame);

  newGame();
})();
</script>
</body>
</html>
